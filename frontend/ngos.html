<!DOCTYPE html>
<html>
<head>
<title>NGOs</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>

<header>
  <div class="logo">NGO Explorer</div>
</header>

<h2 class="title">Explore NGOs 🌍</h2>

<div class="container">

<div class="card">
  <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644">
  <div class="card-content">
    <h3>Helping Hands</h3>
    <p>Education support for children</p>
    <button class="btn" onclick="openNGO('Helping Hands','Education NGO helping poor kids')">
      View Details
    </button>
  </div>
</div>

<div class="card">
  <img src="https://images.unsplash.com/photo-1584515933487-779824d29309">
  <div class="card-content">
    <h3>Health NGO</h3>
    <p>Medical camps & health support</p>
    <button class="btn" onclick="openNGO('Health NGO','Providing medical support to needy')">
      View Details
    </button>
  </div>
</div>

<div class="card">
  <img src="https://images.unsplash.com/photo-1450778869180-41d0601e046e">
  <div class="card-content">
    <h3>Animal Rescue</h3>
    <p>Saving animals & shelters</p>
    <button class="btn" onclick="openNGO('Animal Rescue','Animal welfare and rescue services')">
      View Details
    </button>
  </div>
</div>

</div>

</body>
</html>
